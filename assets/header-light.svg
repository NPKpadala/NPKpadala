<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="Praveen Kumar Padala — Infrastructure Operations &amp; Systems Engineer">
  <title>Praveen Kumar Padala — Infrastructure Operations &amp; Systems Engineer</title>
  <defs>
    <clipPath id="clip0" class="clip0"><rect x="62.8" y="134" width="369.6" height="24"/></clipPath>
    <clipPath id="clip1" class="clip1"><rect x="62.8" y="134" width="361.2" height="24" transform="translate(-361.2,0)"/></clipPath>
    <clipPath id="clip2" class="clip2"><rect x="62.8" y="134" width="277.2" height="24" transform="translate(-277.2,0)"/></clipPath>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A7F37" stop-opacity="0"/>
      <stop offset="45%" stop-color="#1A7F37"/>
      <stop offset="75%" stop-color="#0969DA"/>
      <stop offset="100%" stop-color="#0969DA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A7F37" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1A7F37" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="898" height="198" rx="14"/></clipPath>
  </defs>
  <style>
    .name { font: 600 34px ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #1F2328; letter-spacing: -0.4px }
    .role { font: 400 16px ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #59636E }
    .kicker { font: 500 11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #1A7F37; letter-spacing: 2.4px }
    .typed { font: 400 14px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #1F2328 }
    .prompt { font: 400 14px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #1A7F37 }
    .caret { fill: #1A7F37; opacity: 0 }
    .caret0 { opacity: 1 }
    .trace { fill: none; stroke: #1A7F37; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
    .probe { fill: #0969DA }
    .dim { opacity: 0 }
    @media (prefers-reduced-motion: no-preference) {
      @keyframes reveal0{0%,0.0000%{transform:translateX(-369.6px)}7.3333%,30.6667%{transform:translateX(0)}31.3333%,100%{transform:translateX(-369.6px)}}@keyframes caret0{0%,0.0000%{transform:translateX(0);opacity:0}0.3333%{transform:translateX(0);opacity:1}7.3333%,30.6667%{transform:translateX(369.6px);opacity:1}31.3333%,100%{transform:translateX(369.6px);opacity:0}}.clip0 rect{animation:reveal0 15s steps(44,end) infinite}.caret0{animation:caret0 15s steps(44,end) infinite}  @keyframes reveal1{0%,33.3333%{transform:translateX(-361.2px)}40.6667%,64.0000%{transform:translateX(0)}64.6667%,100%{transform:translateX(-361.2px)}}@keyframes caret1{0%,33.3333%{transform:translateX(0);opacity:0}33.6667%{transform:translateX(0);opacity:1}40.6667%,64.0000%{transform:translateX(361.2px);opacity:1}64.6667%,100%{transform:translateX(361.2px);opacity:0}}.clip1 rect{animation:reveal1 15s steps(43,end) infinite}.caret1{animation:caret1 15s steps(43,end) infinite}  @keyframes reveal2{0%,66.6667%{transform:translateX(-277.2px)}74.0000%,97.3333%{transform:translateX(0)}98.0000%,100%{transform:translateX(-277.2px)}}@keyframes caret2{0%,66.6667%{transform:translateX(0);opacity:0}67.0000%{transform:translateX(0);opacity:1}74.0000%,97.3333%{transform:translateX(277.2px);opacity:1}98.0000%,100%{transform:translateX(277.2px);opacity:0}}.clip2 rect{animation:reveal2 15s steps(33,end) infinite}.caret2{animation:caret2 15s steps(33,end) infinite} 
      @keyframes draw { 0% { stroke-dashoffset: 700 } 45%,100% { stroke-dashoffset: 0 } }
      @keyframes glide { 0% { opacity: 0 } 8%,92% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes slide { 0% { transform: translateX(-320px) } 100% { transform: translateX(900px) } }
      .trace { stroke-dasharray: 700; animation: draw 6s ease-in-out infinite }
      .probe { animation: glide 6s linear infinite }
      .rail { animation: slide 6s linear infinite }
      .dim { opacity: 1 }
