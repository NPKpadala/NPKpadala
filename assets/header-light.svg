    <rect x="0" y="0" width="900" height="200" fill="url(#fade)" opacity="0.35"/>
  </g>

  <text class="kicker" x="46" y="52">OPS · AUTOMATION · RELIABILITY</text>
  <text class="name" x="44" y="94">Praveen Kumar Padala</text>
  <text class="role" x="46" y="120">Infrastructure Operations &amp; Systems Engineer</text>

  <g>
    <text class="prompt" x="46" y="150">$ </text>
    <g clip-path="url(#clip0)"><text x="62.8" y="150" class="typed">provision  ·  harden  ·  monitor  ·  restore</text></g>
    <rect class="caret caret0" x="62.8" y="138" width="8" height="16" transform="translate(369.6,0)"/>
    <g clip-path="url(#clip1)"><text x="62.8" y="150" class="typed">if it runs in production, I carry the pager</text></g>
    <rect class="caret caret1" x="62.8" y="138" width="8" height="16"/>
    <g clip-path="url(#clip2)"><text x="62.8" y="150" class="typed">observability I built, not bought</text></g>
    <rect class="caret caret2" x="62.8" y="138" width="8" height="16"/>
  </g>

  <g transform="translate(0,10)">
    <path class="trace" d="M 596 132 L 622 124 L 648 136 L 674 96 L 700 108 L 726 72 L 752 88 L 778 58 L 804 74 L 830 44 L 856 56"/>
    <circle class="probe dim" r="4">
      <animateMotion dur="6s" repeatCount="indefinite" path="M 596 132 L 622 124 L 648 136 L 674 96 L 700 108 L 726 72 L 752 88 L 778 58 L 804 74 L 830 44 L 856 56" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
    </circle>
  </g>
