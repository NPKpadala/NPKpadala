# Generates the animated contribution-grid snake in the profile's neon palette
# and publishes the SVGs to the `output` branch, which the README links to.
name: Contribution snake

on:
  schedule:
    - cron: "17 */12 * * *"   # twice a day, off the hour so we don't queue behind everyone else
  workflow_dispatch:           # manual run from the Actions tab
  push:
    branches: [main]

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to push the generated SVGs to the output branch
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Colours are literal hex — no space before '#', so YAML does not treat it
          # as a comment. color_dots takes exactly 5 stops, lowest → highest.
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00E5FF&color_dots=#ebedf0,#c6e48b,#7bc96f,#239a3b,#196127
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00E5FF&color_dots=#161b22,#0e4429,#006d32,#26a641,#39FF14

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
